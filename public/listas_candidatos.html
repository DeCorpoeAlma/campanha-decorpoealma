    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        .page-break {
            page-break-after: always;
        }
        body {
            font-family: 'Galano Grotesque Alt', sans-serif;
        }
        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }
        @media (min-width: 640px) {
            .candidate-grid {
                grid-template-columns: repeat(3, minmax(120px, 1fr));
            }
        }
        @media (min-width: 768px) {
            .candidate-grid {
                grid-template-columns: repeat(4, minmax(120px, 1fr));
            }
        }
        @media (min-width: 1024px) {
            .candidate-grid {
                grid-template-columns: repeat(5, minmax(120px, 1fr));
            }
        }

        /* Fontes Galano Grotesque Alt */
        @font-face {
            font-family: 'Galano Grotesque Alt';
            src: url('fonts/galano-grotesque-alt/GalanoGrotesqueAltRegular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Galano Grotesque Alt';
            src: url('fonts/galano-grotesque-alt/GalanoGrotesqueAltRegularItalic.otf') format('opentype');

            font-style: italic;
